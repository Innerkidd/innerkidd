<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <radialGradient id="fbgGlow" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#101b2e" stop-opacity="1"/>
      <stop offset="60%" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="fnameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#22d3ee;#8b5cf6;#ff2e88;#34d399" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#8b5cf6;#ff2e88;#34d399;#22d3ee" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#ff2e88;#34d399;#22d3ee;#8b5cf6" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="fsoftGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="24" fill="url(#fbgGlow)"/>
  <rect width="1200" height="280" rx="24" fill="none" stroke="#30363d" stroke-width="2"/>

  <g fill="#ffffff">
    <circle cx="110" cy="60" r="2.2" opacity="0.65"><animate attributeName="opacity" values="0.65;0.15;0.65" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="130" r="1.8" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="70" r="2.3" opacity="0.7"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="140" r="1.9" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="210" r="2" opacity="0.55"><animate attributeName="opacity" values="0.55;0.12;0.55" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="215" r="2.2" opacity="0.6"><animate attributeName="opacity" values="0.6;0.12;0.6" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="40" r="1.7" opacity="0.45"><animate attributeName="opacity" values="0.45;0.1;0.45" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="225" r="1.8" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="130" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="800" letter-spacing="5" fill="url(#fnameGrad)" filter="url(#fsoftGlow)">LET'S BUILD SOMETHING GREAT</text>

  <line x1="470" y1="160" x2="730" y2="160" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>

  <text x="600" y="205" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="24" fill="#8b949e">always building, always learning<tspan fill="#34d399"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>_</tspan></text>
</svg>
