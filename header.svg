<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1b1035" stop-opacity="1"/>
      <stop offset="60%" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2e88">
        <animate attributeName="stop-color" values="#ff2e88;#8b5cf6;#22d3ee;#34d399;#ff2e88" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#22d3ee;#34d399;#ff2e88;#8b5cf6" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#34d399;#ff2e88;#8b5cf6;#22d3ee" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bgGlow)"/>
  <rect width="1200" height="320" rx="24" fill="none" stroke="#30363d" stroke-width="2"/>

  <g fill="#ffffff">
    <circle cx="90" cy="60" r="2.4" opacity="0.7"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="140" r="1.8" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="70" r="2.1" opacity="0.6"><animate attributeName="opacity" values="0.6;0.12;0.6" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="80" r="2.3" opacity="0.7"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="150" r="1.9" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="70" r="2.2" opacity="0.6"><animate attributeName="opacity" values="0.6;0.12;0.6" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="250" r="2" opacity="0.55"><animate attributeName="opacity" values="0.55;0.12;0.55" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="250" r="2.4" opacity="0.65"><animate attributeName="opacity" values="0.65;0.15;0.65" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="42" r="1.7" opacity="0.45"><animate attributeName="opacity" values="0.45;0.1;0.45" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="265" r="1.8" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="262" r="2" opacity="0.55"><animate attributeName="opacity" values="0.55;0.12;0.55" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="160" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="82" font-weight="800" letter-spacing="8" fill="url(#nameGrad)" filter="url(#softGlow)">SHLOK SOLANKI</text>

  <line x1="430" y1="192" x2="770" y2="192" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>

  <text x="600" y="238" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="27" fill="#8b949e">&gt; full-stack developer<tspan fill="#34d399"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>_</tspan></text>
</svg>
